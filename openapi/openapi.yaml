components:
  responses:
    '400':
      description: HTTP 400; business endpoints return APIResponse
    '401':
      description: HTTP 401; business endpoints return APIResponse
    '403':
      description: HTTP 403; business endpoints return APIResponse
    '500':
      description: HTTP 500; business endpoints return APIResponse
    '503':
      description: HTTP 503; business endpoints return APIResponse
  schemas:
    WalletOwnerType:
      type: string
      enum: [CUSTOMER, CAREGIVER, CENTER, PLATFORM]
    WalletTransactionType:
      type: string
      enum:
        - REFUND_CREDIT
        - FORFEIT_CREDIT
        - SERVICE_SETTLEMENT
        - COMMISSION_CREDIT
        - COMPLAINT_DEBIT
        - WITHDRAWAL_HOLD
        - WITHDRAWAL_RELEASE
        - WITHDRAWAL_PAID
    WalletWithdrawalScope:
      type: string
      enum: [OWN, REVIEW]
    WalletWithdrawalStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED, COMPLETED]
    WalletStatisticsGroupBy:
      type: string
      enum: [DAY, MONTH]
    RefundChannel:
      type: string
      enum: [GATEWAY, WALLET]
    WalletRecord:
      type: object
      required:
        - ownerType
        - ownerId
        - availableBalance
        - heldBalance
        - withdrawable
      properties:
        id:
          type: [string, 'null']
          format: uuid
          description: Null until the wallet has its first movement.
        ownerType:
          $ref: '#/components/schemas/WalletOwnerType'
        ownerId:
          type: string
          format: uuid
        availableBalance:
          type: number
        heldBalance:
          type: number
          description: Held by withdrawal requests awaiting the admin.
        withdrawable:
          type: boolean
        updatedAt:
          type: [string, 'null']
          format: date-time
    WalletTransactionRecord:
      type: object
      required:
        - id
        - walletId
        - type
        - amount
        - availableBefore
        - availableAfter
        - heldBefore
        - heldAfter
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        walletId:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/WalletTransactionType'
        amount:
          type: number
        availableBefore:
          type: number
        availableAfter:
          type: number
        heldBefore:
          type: number
        heldAfter:
          type: number
        centerId:
          type: [string, 'null']
          format: uuid
        bookingId:
          type: [string, 'null']
          format: uuid
        occurrenceId:
          type: [string, 'null']
          format: uuid
        refundId:
          type: [string, 'null']
          format: uuid
        withdrawalId:
          type: [string, 'null']
          format: uuid
        note:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
    WalletTypeTotalRecord:
      type: object
      required:
        - type
        - count
        - totalAmount
      properties:
        type:
          $ref: '#/components/schemas/WalletTransactionType'
        count:
          type: integer
        totalAmount:
          type: number
    WalletBalanceTotalRecord:
      type: object
      required:
        - ownerType
        - walletCount
        - availableBalance
        - heldBalance
      properties:
        ownerType:
          $ref: '#/components/schemas/WalletOwnerType'
        walletCount:
          type: integer
        availableBalance:
          type: number
        heldBalance:
          type: number
    WalletSeriesPointRecord:
      type: object
      required:
        - period
        - income
        - withdrawn
      properties:
        period:
          type: string
          description: yyyy-MM-dd (DAY) or yyyy-MM (MONTH), Vietnam time.
        income:
          type: number
        withdrawn:
          type: number
        spent:
          type: [number, 'null']
          description: Customer wallets only.
    WalletStatisticsRecord:
      type: object
      required:
        - ownerType
        - from
        - to
        - groupBy
        - availableBalance
        - heldBalance
        - totalIncome
        - totalWithdrawn
        - bookingCount
        - byType
        - series
      properties:
        ownerType:
          $ref: '#/components/schemas/WalletOwnerType'
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        groupBy:
          $ref: '#/components/schemas/WalletStatisticsGroupBy'
        availableBalance:
          type: number
        heldBalance:
          type: number
        totalIncome:
          type: number
        totalWithdrawn:
          type: number
        bookingCount:
          type: integer
        byType:
          type: array
          items:
            $ref: '#/components/schemas/WalletTypeTotalRecord'
        series:
          type: array
          items:
            $ref: '#/components/schemas/WalletSeriesPointRecord'
        totalPaid:
          type: number
        refundedToWallet:
          type: number
        refundedToGateway:
          type: number
        netSpent:
          type: number
        forfeitIncome:
          type: number
        serviceIncome:
          type: number
        commissionDeducted:
          type: number
        complaintDebits:
          type: number
        commissionIncome:
          type: number
        grossCollected:
          type: number
        totalRefunded:
          type: number
        liabilities:
          type: array
          items:
            $ref: '#/components/schemas/WalletBalanceTotalRecord'
        pendingWithdrawalCount:
          type: integer
        pendingWithdrawalAmount:
          type: number
    WalletWithdrawalRecord:
      type: object
      required:
        - id
        - walletId
        - requesterUserId
        - ownerType
        - amount
        - bankName
        - bankAccountNumber
        - accountHolderName
        - status
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        walletId:
          type: string
          format: uuid
        requesterUserId:
          type: string
          format: uuid
        requesterName:
          type: string
          nullable: true
          description: Requester's name from IdentityService (list and detail only; null when Identity did not answer).
        requesterPhoneNumber:
          type: string
          nullable: true
        ownerType:
          $ref: '#/components/schemas/WalletOwnerType'
        centerId:
          type: [string, 'null']
          format: uuid
        amount:
          type: number
        bankName:
          type: string
        bankAccountNumber:
          type: string
        accountHolderName:
          type: string
        status:
          $ref: '#/components/schemas/WalletWithdrawalStatus'
        rejectReason:
          type: [string, 'null']
        reviewedBy:
          type: [string, 'null']
          format: uuid
        reviewedAt:
          type: [string, 'null']
          format: date-time
        transferReference:
          type: [string, 'null']
        completedBy:
          type: [string, 'null']
          format: uuid
        completedAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: [string, 'null']
          format: date-time
    CreateWalletWithdrawalRequest:
      type: object
      required:
        - amount
        - bankName
        - bankAccountNumber
        - accountHolderName
      properties:
        amount:
          type: number
          description: Whole dong, at most the available balance.
        bankName:
          type: string
          maxLength: 100
        bankAccountNumber:
          type: string
          pattern: '^[0-9]{6,20}$'
        accountHolderName:
          type: string
          maxLength: 100
        centerId:
          type: [string, 'null']
          format: uuid
          description: Customer / caregiver wallets — the center holding the money (from center-balances); that center handles the request.
    RejectWalletWithdrawalRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          maxLength: 500
    WalletCenterBalanceRecord:
      type: object
      required:
        - availableBalance
      properties:
        centerId:
          type: [string, 'null']
          format: uuid
        availableBalance:
          type: number
    WalletCenterBalanceListResponse:
      type: object
      required:
        - code
        - message
        - result
      properties:
        code:
          type: integer
        message:
          type: string
        result:
          type: array
          items:
            $ref: '#/components/schemas/WalletCenterBalanceRecord'
    WithdrawalOwnerTotalRecord:
      type: object
      required:
        - ownerType
        - pendingCount
        - pendingAmount
        - completedCount
        - completedAmount
      properties:
        ownerType:
          $ref: '#/components/schemas/WalletOwnerType'
        pendingCount:
          type: integer
        pendingAmount:
          type: number
        completedCount:
          type: integer
        completedAmount:
          type: number
    WithdrawalSeriesPointRecord:
      type: object
      required:
        - period
        - requested
        - completed
      properties:
        period:
          type: string
        requested:
          type: number
        completed:
          type: number
    WalletWithdrawalStatisticsRecord:
      type: object
      required:
        - scope
        - from
        - to
        - groupBy
        - pendingCount
        - pendingAmount
        - requestedCount
        - requestedAmount
        - completedCount
        - completedAmount
        - rejectedCount
        - rejectedAmount
        - byOwnerType
        - series
      properties:
        scope:
          $ref: '#/components/schemas/WalletWithdrawalScope'
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        groupBy:
          $ref: '#/components/schemas/WalletStatisticsGroupBy'
        pendingCount:
          type: integer
        pendingAmount:
          type: number
        requestedCount:
          type: integer
        requestedAmount:
          type: number
        completedCount:
          type: integer
        completedAmount:
          type: number
        rejectedCount:
          type: integer
        rejectedAmount:
          type: number
        avgProcessingMinutes:
          type: [integer, 'null']
        byOwnerType:
          type: array
          items:
            $ref: '#/components/schemas/WithdrawalOwnerTotalRecord'
        series:
          type: array
          items:
            $ref: '#/components/schemas/WithdrawalSeriesPointRecord'
        custodyCustomerBalance:
          type: number
        custodyCaregiverBalance:
          type: number
        custodyHeldBalance:
          type: number
        custodyTotal:
          type: number
    WalletWithdrawalStatisticsResponse:
      type: object
      required:
        - code
        - message
        - result
      properties:
        code:
          type: integer
        message:
          type: string
        result:
          $ref: '#/components/schemas/WalletWithdrawalStatisticsRecord'
    WalletResponse:
      type: object
      required:
        - code
        - message
        - result
      properties:
        code:
          type: integer
        message:
          type: string
        result:
          $ref: '#/components/schemas/WalletRecord'
    WalletTransactionPage:
      type: object
      required:
        - items
        - page
        - size
        - totalElements
        - totalPages
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WalletTransactionRecord'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
        totalPages:
          type: integer
    WalletTransactionPageResponse:
      type: object
      required:
        - code
        - message
        - result
      properties:
        code:
          type: integer
        message:
          type: string
        result:
          $ref: '#/components/schemas/WalletTransactionPage'
    BookingSettlementResponse:
      type: object
      required:
        - code
        - message
        - result
      properties:
        code:
          type: integer
        message:
          type: string
        result:
          $ref: '#/components/schemas/BookingSettlementRecord'
    OccurrenceFinalStatus:
      type: string
      enum:
        - COMPLETED
        - CANCELLED
        - MISSED
        - CUSTOMER_NO_SHOW
    BookingSettlementRecord:
      type: object
      required:
        - bookingId
        - centerId
        - paidAmount
        - refundedAmount
        - centerServiceAmount
        - centerKeptDepositAmount
        - caregiverKeptDepositAmount
        - complaintDebitAmount
        - centerNetAmount
        - commissionAmount
        - settledCount
        - pendingCount
        - occurrences
      properties:
        bookingId:
          type: string
          format: uuid
        centerId:
