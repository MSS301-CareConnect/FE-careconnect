openapi: 3.1.0
info:
  title: CareConnect IdentityService
  version: 0.0.1
  description: Reviewed frontend snapshot of IdentityService web authentication,
    current-user security, account administration, roles, and permissions.
servers:
  - url: /api
tags:
  - name: Authentication
  - name: Account
  - name: Role
  - name: Permission
paths:
  /auth/csrf:
    get:
      tags:
        - Authentication
      operationId: getCsrfToken
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfResponse'
        '400': &a1
          $ref: '#/components/responses/400'
        '401': &a2
          $ref: '#/components/responses/401'
        '403': &a3
          $ref: '#/components/responses/403'
        '500': &a4
          $ref: '#/components/responses/500'
        '503': &a5
          $ref: '#/components/responses/503'
  /auth/login:
    post:
      tags:
        - Authentication
      operationId: loginWeb
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '400': *a1
        '401': *a2
        '403': *a3
        '500': *a4
        '503': *a5
  /auth/refresh:
    post:
      tags:
        - Authentication
      operationId: refreshWebSession
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '400': *a1
        '401': *a2
        '403': *a3
        '500': *a4
        '503': *a5
  /auth/logout:
    post:
      tags:
        - Authentication
      operationId: logoutWebSession
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '400': *a1
        '401': *a2
        '403': *a3
        '500': *a4
        '503': *a5
  /auth/logout-all:
    post:
      tags:
        - Authentication
      operationId: logoutAllWebSessions
      responses:
        '200':
          description: All sessions for the current user are revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyActionResponse'
        '401': *a2
        '403': *a3
        '500': *a4
        '503': *a5
  /users/me:
    get:
      tags:
        - Account
      operationId: getCurrentUser
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '400': *a1
        '401': *a2
        '403': *a3
        '500': *a4
        '503': *a5
    put:
      tags:
        - Account
      operationId: updateMyProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Updated current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '400': *a1
        '401': *a2
        '403': *a3
        '500': *a4
        '503': *a5
  /users/me/change-password:
    post:
      tags:
        - Account
      operationId: changeMyPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed; all prior sessions are invalidated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyActionResponse'
        '400': *a1
        '401': *a2
        '403': *a3
        '500': *a4
        '503': *a5
  /users:
    get:
      tags:
        - Account
      operationId: listManagedUsers
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Page of users visible to the actor, without a total count.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '400': *a1
        '401': *a2
        '403': *a3
        '500': *a4
        '503': *a5
    post:
      tags:
        - Account
      operationId: provisionUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProvisionUserRequest'
      responses:
        '200':
          description: Account created without a password; user sets it through OTP recovery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '400': *a1
        '401': *a2
        '403': *a3
        '500': *a4
        '503': *a5
  /users/{id}:
    parameters:
      - &userIdParameter
        name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - Account
      operationId: getManagedUser
      responses:
        '200':
          description: User visible to the actor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '400': *a1
        '401': *a2
        '403': *a3
        '500': *a4
        '503': *a5
    put:
      tags:
        - Account
      operationId: updateManagedUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Updated user profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '400': *a1
        '401': *a2
        '403': *a3
        '500': *a4
        '503': *a5
    delete:
      tags:
        - Account
      operationId: deleteManagedUser
      responses:
        '200':
          description: Account soft-deleted; its email remains reserved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyActionResponse'
        '401': *a2
        '403': *a3
        '500': *a4
        '503': *a5
  /users/{id}/status:
    patch:
      tags:
        - Account
      operationId: setManagedUserStatus
      parameters:
        - *userIdParameter
        - name: status
          in: query
          required: true
          schema:
            type: string
            enum: [ACTIVE, LOCKED]
      responses:
        '200':
          description: Updated account status; sessions are revoked when changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '400': *a1
        '401': *a2
        '403': *a3
        '500': *a4
        '503': *a5
  /users/{id}/roles/{roleId}:
    parameters:
      - *userIdParameter
      - name: roleId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags:
        - Account
      operationId: assignManagedUserRole
      responses:
        '200':
          description: Role assigned to user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '400': *a1
        '401': *a2
        '403': *a3
        '500': *a4
        '503': *a5
    delete:
      tags:
        - Account
      operationId: revokeManagedUserRole
      responses:
        '200':
          description: Role revoked from user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '400': *a1
        '401': *a2
        '403': *a3
        '500': *a4
        '503': *a5
  /roles:
    get:
      tags:
        - Role
      operationId: listManagedRoles
      responses:
        '200':
          description: All non-deleted roles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleListResponse'
        '401': *a2
        '403': *a3
        '500': *a4
        '503': *a5
    post:
      tags:
        - Role
      operationId: createManagedRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleRequest'
      responses:
        '200':
          description: Custom role created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleActionResponse'
        '400': *a1
        '401': *a2
        '403': *a3
        '500': *a4
        '503': *a5
  /roles/{id}/permissions:
    put:
      tags:
        - Role
      operationId: setManagedRolePermissions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetRolePermissionsRequest'
      responses:
        '200':
          description: Permissions replaced for a custom role; built-in roles cannot be modified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleActionResponse'
        '400': *a1
        '401': *a2
        '403': *a3
        '500': *a4
        '503': *a5
  /permissions:
    get:
      tags:
        - Permission
      operationId: listManagedPermissions
      responses:
        '200':
          description: Available permission catalog.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionListResponse'
        '401': *a2
        '403': *a3
        '500': *a4
        '503': *a5
  /users/forgot-password:
    post:
      tags:
        - Account
      operationId: requestPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetEmailRequest'
      responses:
        '200':
          description: Neutral response whether or not the email belongs to an account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetActionResponse'
        '400': *a1
        '403': *a3
        '500': *a4
        '503': *a5
  /users/reset-password:
    post:
      tags:
        - Account
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password reset using the emailed OTP.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetActionResponse'
        '400': *a1
        '403': *a3
        '500': *a4
        '503': *a5
  /users/register:
    post:
      tags:
        - Account
      operationId: registerCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: OTP sent to the supplied email; no account is created yet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400': *a1
        '401': *a2
        '403': *a3
        '429':
          description: OTP resend cooldown is active.
        '500': *a4
        '503': *a5
  /users/register/verify:
    post:
      tags:
        - Account
      operationId: verifyCustomerRegistration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRegistrationRequest'
      responses:
        '200':
          description: Email verified and customer account created; sign in separately.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyRegistrationResponse'
        '400': *a1
        '401': *a2
        '403': *a3
        '500': *a4
        '503': *a5
  /users/register/resend-otp:
    post:
      tags:
        - Account
      operationId: resendRegistrationOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationEmailRequest'
      responses:
        '200':
          description: A new OTP was sent for a pending registration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResendRegistrationOtpResponse'
        '400': *a1
        '401': *a2
        '403': *a3
        '429':
          description: OTP resend cooldown is active.
        '500': *a4
        '503': *a5
components:
  responses:
    '400':
      description: HTTP 400; business endpoints return APIResponse
    '401':
      description: HTTP 401; business endpoints return APIResponse
    '403':
      description: HTTP 403; business endpoints return APIResponse
    '500':
      description: HTTP 500; business endpoints return APIResponse
    '503':
      description: HTTP 503; business endpoints return APIResponse
  schemas:
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          minLength: 1
        newPassword:
          type: string
          minLength: 8
          maxLength: 72
          description: Must include lowercase, uppercase, digit, and special character; UTF-8 encoding must be at most 72 bytes.
    ProvisionUserRequest:
      type: object
      required: [email, fullName, roleCode]
      properties:
        email:
          type: string
          format: email
          minLength: 1
        fullName:
          type: string
          minLength: 1
          maxLength: 255
        phoneNumber:
          type: string
          pattern: '^[0-9]{10,11}$'
        roleCode:
          type: string
          enum: [CUSTOMER, CAREGIVER, CENTER_MANAGER]
        centerId:
          type: string
          format: uuid
    CreateRoleRequest:
      type: object
      required: [roleCode, roleName]
      properties:
        roleCode:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{1,63}$'
        roleName:
          type: string
          minLength: 1
        description:
          type: string
    SetRolePermissionsRequest:
      type: object
      required: [permissionIds]
      properties:
        permissionIds:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
    RoleRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
        roleCode:
          type: string
        roleName:
          type: string
        description:
          type: string
        active:
          type: boolean
        permissions:
          type: array
          uniqueItems: true
          items:
            type: string
    PermissionRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
        permissionCode:
          type: string
        permissionName:
          type: string
        resource:
          type: string
        description:
          type: string
    UserListResponse:
      type: object
      required: [code, message, result]
      properties:
        code:
          type: integer
        message:
          type: string
        result:
          type: array
          items:
            $ref: '#/components/schemas/UserResponse'
    RoleListResponse:
      type: object
      required: [code, message, result]
      properties:
        code:
          type: integer
        message:
          type: string
        result:
          type: array
          items:
            $ref: '#/components/schemas/RoleRecord'
    RoleActionResponse:
      type: object
      required: [code, message, result]
      properties:
        code:
          type: integer
        message:
          type: string
        result:
          $ref: '#/components/schemas/RoleRecord'
    PermissionListResponse:
      type: object
      required: [code, message, result]
      properties:
        code:
          type: integer
        message:
          type: string
        result:
          type: array
          items:
            $ref: '#/components/schemas/PermissionRecord'
    EmptyActionResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
        message:
          type: string
        result:
          type: 'null'
    UpdateProfileRequest:
      type: object
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 255
        phoneNumber:
          type: string
          pattern: '^[0-9]{10,11}$'
    PasswordResetEmailRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          minLength: 1
    ResetPasswordRequest:
      type: object
      required:
        - email
        - otpCode
        - newPassword
      properties:
        email:
          type: string
          format: email
          minLength: 1
        otpCode:
          type: string
          pattern: '^[0-9]{6}$'
        newPassword:
          type: string
          minLength: 8
          maxLength: 72
          description: Must include lowercase, uppercase, digit, and special character; UTF-8 encoding must be at most 72 bytes.
    PasswordResetActionResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
        message:
          type: string
        result:
          type: 'null'
    RegisterRequest:
      type: object
      required:
        - email
        - password
        - fullName
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          minLength: 8
          maxLength: 72
          description: Must include lowercase, uppercase, digit, and special character; UTF-8 encoding must be at most 72 bytes.
        fullName:
          type: string
          minLength: 1
          maxLength: 255
        phoneNumber:
          type: string
          pattern: '^[0-9]{10,11}$'
    VerifyRegistrationRequest:
      type: object
      required:
        - email
        - otpCode
      properties:
        email:
          type: string
          format: email
          minLength: 1
        otpCode:
          type: string
          pattern: '^[0-9]{6}$'
    RegistrationEmailRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          minLength: 1
    RegistrationOtp:
      type: object
      required:
        - email
        - expiresInSeconds
        - resendAfterSeconds
      properties:
        email:
          type: string
          format: email
        expiresInSeconds:
          type: integer
          format: int64
        resendAfterSeconds:
          type: integer
          format: int64
    RegisterResponse:
      type: object
      required:
        - code
        - message
        - result
      properties:
        code:
          type: integer
        message:
          type: string
        result:
          $ref: '#/components/schemas/RegistrationOtp'
    ResendRegistrationOtpResponse:
      type: object
      required:
        - code
        - message
        - result
      properties:
        code:
          type: integer
        message:
          type: string
        result:
          $ref: '#/components/schemas/RegistrationOtp'
    VerifyRegistrationResponse:
      type: object
      required:
        - code
        - message
        - result
      properties:
        code:
          type: integer
        message:
          type: string
        result:
          $ref: '#/components/schemas/UserResponse'
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          minLength: 1
      required:
        - email
        - password
    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        fullName:
          type: string
        phoneNumber:
          type: string
        status:
          type: string
          enum:
            - ACTIVE
            - LOCKED
        centerId:
          type: string
          format: uuid
        roles:
          type: array
          items:
            type: string
          uniqueItems: true
        permissions:
          type: array
          items:
            type: string
          uniqueItems: true
        createdAt:
          type: string
          format: date-time
    CsrfToken:
      type: object
      required:
        - token
        - headerName
      properties:
        token:
          type: string
        headerName:
          type: string
          example: X-XSRF-TOKEN
    AuthenticationResult:
      type: object
      required:
        - authenticated
        - csrfToken
        - expiresInSeconds
      properties:
        authenticated:
          type: boolean
        csrfToken:
          type: string
        expiresInSeconds:
          type: integer
          format: int64
    CsrfResponse:
      type: object
      required:
        - code
        - message
        - result
      properties:
        code:
          type: integer
        message:
          type: string
        result:
          $ref: '#/components/schemas/CsrfToken'
    AuthSessionResponse:
      type: object
      required:
        - code
        - message
        - result
      properties:
        code:
          type: integer
        message:
          type: string
        result:
          $ref: '#/components/schemas/AuthenticationResult'
    LogoutResponse:
      type: object
      required:
        - code
        - message
        - result
      properties:
        code:
          type: integer
        message:
          type: string
        result:
          type: 'null'
    CurrentUserResponse:
      type: object
      required:
        - code
        - message
        - result
      properties:
        code:
          type: integer
        message:
          type: string
        result:
          $ref: '#/components/schemas/UserResponse'
