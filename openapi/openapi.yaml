components:
  responses:
    '400':
      description: HTTP 400; business endpoints return APIResponse
    '401':
      description: HTTP 401; business endpoints return APIResponse
    '403':
      description: HTTP 403; business endpoints return APIResponse
    '500':
      description: HTTP 500; business endpoints return APIResponse
    '503':
      description: HTTP 503; business endpoints return APIResponse
  schemas:
    ProviderCenterRecord:
      type: object
      required:
        - id
        - centerName
        - centerStatus
        - version
      properties:
        id: &a1
          type: string
          format: uuid
        centerId:
          type: string
          format: uuid
        centerName:
          type: string
        phoneNumber:
          type: string
        email:
          type: string
        address:
          type: string
        operatingHours:
          type: string
        centerStatus:
          type: string
          enum:
            - PENDING
            - ACTIVE
            - INACTIVE
            - SUSPENDED
            - REJECTED
            - ARCHIVED
        statusReason:
          type: string
        managerUserId:
          type: string
          format: uuid
        version:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ProviderCaregiverRecord:
      type: object
      required:
        - id
        - centerId
        - fullName
        - caregiverStatus
        - verificationStatus
        - version
      properties:
        id: *a1
        caregiverId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        centerId:
          type: string
          format: uuid
        centerName:
          type: string
        fullName:
          type: string
        gender:
          type: string
          enum:
            - MALE
            - FEMALE
            - OTHER
        dateOfBirth:
          type: string
          format: date
        experienceYears:
          type: integer
        bio:
          type: string
        ratingAverage:
          type: number
        ratingCount:
          type: integer
        verificationStatus:
          type: string
          enum:
            - PENDING
            - VERIFIED
            - REJECTED
        caregiverStatus:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
            - SUSPENDED
            - ARCHIVED
        verificationReason:
          type: string
        version:
          type: integer
        createdAt:
          type: string
