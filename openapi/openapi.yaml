openapi: 3.1.0
info:
  title: CareConnect gateway frontend snapshot
  version: 0.0.1
  description: Reviewed frontend snapshot of IdentityService and ProviderService
    operations consumed through the API gateway.
servers:
  - url: /api
tags:
  - name: Authentication
  - name: Account
  - name: Role
  - name: Permission
  - name: ProviderCenter
  - name: ProviderCaregiver
  - name: ProviderCertificate
  - name: ProviderWorkShift
  - name: ProviderMedia
  - name: CatalogItem
  - name: CenterOffering
  - name: PricePlan
  - name: CareRecipient
paths:
  /v1/auth/csrf:
    get:
      tags:
        - Authentication
      operationId: getCsrfToken
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfResponse'
        '400': &a1
          $ref: '#/components/responses/400'
        '401': &a2
          $ref: '#/components/responses/401'
        '403': &a3
          $ref: '#/components/responses/403'
        '500': &a4
          $ref: '#/components/responses/500'
        '503': &a5
          $ref: '#/components/responses/503'
  /v1/auth/login:
    post:
      tags:
        - Authentication
      operationId: loginWeb
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '400': *a1
        '401': *a2
        '403': *a3
        '500': *a4
        '503': *a5
  /v1/auth/refresh:
    post:
      tags:
        - Authentication
      operationId: refreshWebSession
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '400': *a1
        '401': *a2
        '403': *a3
        '500': *a4
        '503': *a5
  /v1/auth/logout:
    post:
      tags:
        - Authentication
      operationId: logoutWebSession
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '400': *a1
        '401': *a2
        '403': *a3
        '500': *a4
        '503': *a5
  /v1/auth/logout-all:
    post:
      tags:
        - Authentication
      operationId: logoutAllWebSessions
      responses:
        '200':
          description: All sessions for the current user are revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyActionResponse'
        '401': *a2
        '403': *a3
        '500': *a4
        '503': *a5
  /v1/auth/sessions:
    get:
      tags:
        - Authentication
      operationId: listWebSessions
      responses:
        '200':
          description: Active sessions for the current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionListResponse'
        '401': *a2
        '403': *a3
        '500': *a4
        '503': *a5
  /v1/auth/sessions/{sessionId}:
    delete:
      tags:
        - Authentication
      operationId: revokeWebSession
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The selected session was revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyActionResponse'
        '400': *a1
        '401': *a2
        '403': *a3
        '500': *a4
        '503': *a5
  /v1/users/me:
    get:
      tags:
        - Account
      operationId: getCurrentUser
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '400': *a1
        '401': *a2
        '403': *a3
        '500': *a4
        '503': *a5
    put:
      tags:
        - Account
      operationId: updateMyProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Updated current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '400': *a1
        '401': *a2
        '403': *a3
        '500': *a4
        '503': *a5
  /v1/users/me/change-password:
    post:
      tags:
        - Account
      operationId: changeMyPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed; all prior sessions are invalidated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyActionResponse'
        '400': *a1
        '401': *a2
        '403': *a3
        '500': *a4
        '503': *a5
  /v1/users:
    get:
      tags:
        - Account
      operationId: listManagedUsers
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Page of users visible to the actor, without a total count.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '400': *a1
        '401': *a2
        '403': *a3
        '500': *a4
        '503': *a5
    post:
      tags:
        - Account
      operationId: provisionUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProvisionUserRequest'
      responses:
        '200':
          description: Account created without a password; user sets it through OTP recovery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '400': *a1
        '401': *a2
        '403': *a3
        '500': *a4
        '503': *a5
  /v1/users/{id}:
    parameters:
      - &userIdParameter
        name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - Account
      operationId: getManagedUser
      responses:
        '200':
          description: User visible to the actor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '400': *a1
        '401': *a2
        '403': *a3
        '500': *a4
        '503': *a5
    put:
      tags:
        - Account
      operationId: updateManagedUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Updated user profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '400': *a1
        '401': *a2
        '403': *a3
        '500': *a4
        '503': *a5
    delete:
      tags:
        - Account
      operationId: deleteManagedUser
      responses:
        '200':
          description: Account soft-deleted; its email remains reserved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyActionResponse'
        '401': *a2
        '403': *a3
        '500': *a4
        '503': *a5
  /v1/users/{id}/status:
    patch:
      tags:
        - Account
      operationId: setManagedUserStatus
      parameters:
        - *userIdParameter
        - name: status
          in: query
          required: true
          schema:
            type: string
            enum: [ACTIVE, LOCKED]
      responses:
        '200':
          description: Updated account status; sessions are revoked when changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '400': *a1
        '401': *a2
        '403': *a3
        '500': *a4
        '503': *a5
  /v1/users/{id}/roles/{roleId}:
    parameters:
      - *userIdParameter
      - name: roleId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags:
        - Account
      operationId: assignManagedUserRole
      responses:
        '200':
          description: Role assigned to user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '400': *a1
        '401': *a2
        '403': *a3
        '500': *a4
        '503': *a5
    delete:
      tags:
        - Account
      operationId: revokeManagedUserRole
      responses:
        '200':
          description: Role revoked from user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '400': *a1
        '401': *a2
        '403': *a3
        '500': *a4
        '503': *a5
  /v1/roles:
    get:
      tags:
        - Role
      operationId: listManagedRoles
      responses:
        '200':
          description: All non-deleted roles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleListResponse'
        '401': *a2
        '403': *a3
        '500': *a4
        '503': *a5
    post:
      tags:
        - Role
      operationId: createManagedRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleRequest'
      responses:
        '200':
          description: Custom role created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleActionResponse'
        '400': *a1
        '401': *a2
        '403': *a3
        '500': *a4
        '503': *a5
  /v1/roles/{id}/permissions:
    put:
      tags:
        - Role
      operationId: setManagedRolePermissions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetRolePermissionsRequest'
      responses:
        '200':
          description: Permissions replaced for a custom role; built-in roles cannot be modified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleActionResponse'
        '400': *a1
        '401': *a2
        '403': *a3
        '500': *a4
        '503': *a5
  /v1/permissions:
    get:
      tags:
        - Permission
      operationId: listManagedPermissions
      responses:
        '200':
          description: Available permission catalog.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionListResponse'
        '401': *a2
        '403': *a3
        '500': *a4
        '503': *a5
  /v1/auth/forgot-password:
    post:
      tags:
        - Account
      operationId: requestPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetEmailRequest'
      responses:
        '200':
          description: Neutral response whether or not the email belongs to an account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetActionResponse'
        '400': *a1
        '403': *a3
        '500': *a4
        '503': *a5
  /v1/auth/reset-password:
    post:
      tags:
        - Account
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password reset using the emailed OTP.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetActionResponse'
        '400': *a1
        '403': *a3
        '500': *a4
        '503': *a5
  /v1/auth/register:
    post:
      tags:
        - Account
      operationId: registerCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: OTP sent to the supplied email; no account is created yet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400': *a1
        '401': *a2
        '403': *a3
        '429':
          description: OTP resend cooldown is active.
        '500': *a4
        '503': *a5
  /v1/auth/register/verify:
    post:
      tags:
        - Account
      operationId: verifyCustomerRegistration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRegistrationRequest'
      responses:
        '200':
          description: Email verified and customer account created; sign in separately.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyRegistrationResponse'
        '400': *a1
        '401': *a2
        '403': *a3
        '500': *a4
        '503': *a5
  /v1/auth/register/resend-otp:
    post:
      tags:
        - Account
      operationId: resendRegistrationOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationEmailRequest'
      responses:
        '200':
          description: A new OTP was sent for a pending registration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResendRegistrationOtpResponse'
        '400': *a1
        '401': *a2
        '403': *a3
        '429':
          description: OTP resend cooldown is active.
        '500': *a4
        '503': *a5
  /v1/care-centers:
    get:
      tags:
        - ProviderCenter
      operationId: listProviderCenters
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - PENDING
              - ACTIVE
              - INACTIVE
              - SUSPENDED
              - REJECTED
              - ARCHIVED
        - name: keyword
          in: query
          required: false
          schema:
            type: string
        - name: includeDeleted
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderCenterPageResponse'
        '400':
          description: ProviderService error
        '401':
          description: ProviderService error
        '403':
          description: ProviderService error
        '404':
          description: ProviderService error
        '500':
          description: ProviderService error
        '503':
          description: ProviderService error
    post:
      tags:
        - ProviderCenter
      operationId: createProviderCenter
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CenterCreateRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderCenterResponse'
        '400':
          description: ProviderService error
        '401':
          description: ProviderService error
        '403':
          description: ProviderService error
        '404':
          description: ProviderService error
        '500':
          description: ProviderService error
        '503':
          description: ProviderService error
  /v1/care-centers/{centerId}:
    get:
      tags:
        - ProviderCenter
      operationId: getProviderCenter
      parameters:
        - name: centerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderCenterResponse'
        '400':
          description: ProviderService error
        '401':
          description: ProviderService error
        '403':
          description: ProviderService error
        '404':
          description: ProviderService error
        '500':
          description: ProviderService error
        '503':
          description: ProviderService error
    put:
      tags:
        - ProviderCenter
      operationId: updateProviderCenter
      parameters:
        - name: centerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CenterUpdateRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderCenterResponse'
        '400':
          description: ProviderService error
        '401':
          description: ProviderService error
        '403':
          description: ProviderService error
        '404':
          description: ProviderService error
        '500':
          description: ProviderService error
        '503':
          description: ProviderService error
    delete:
      tags:
        - ProviderCenter
      operationId: archiveProviderCenter
      parameters:
        - name: centerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: version
          in: query
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyActionResponse'
        '400':
          description: ProviderService error
        '401':
          description: ProviderService error
        '403':
          description: ProviderService error
        '404':
          description: ProviderService error
        '500':
          description: ProviderService error
        '503':
          description: ProviderService error
  /v1/care-centers/{centerId}/status:
    patch:
      tags:
        - ProviderCenter
      operationId: setProviderCenterStatus
      parameters:
        - name: centerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CenterStatusUpdateRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderCenterResponse'
        '400':
          description: ProviderService error
        '401':
          description: ProviderService error
        '403':
          description: ProviderService error
        '404':
          description: ProviderService error
        '500':
          description: ProviderService error
        '503':
          description: ProviderService error
  /v1/caregivers/centers/{centerId}:
    get:
      tags:
        - ProviderCaregiver
      operationId: listCenterCaregivers
      parameters:
        - name: centerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: verification
          in: query
          required: false
          schema:
            type: string
            enum:
              - PENDING
              - VERIFIED
              - REJECTED
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - ACTIVE
              - INACTIVE
              - SUSPENDED
              - ARCHIVED
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderCaregiverPageResponse'
        '400':
          description: ProviderService error
        '401':
          description: ProviderService error
        '403':
          description: ProviderService error
        '404':
          description: ProviderService error
        '500':
          description: ProviderService error
        '503':
          description: ProviderService error
    post:
      tags:
        - ProviderCaregiver
      operationId: createProviderCaregiver
      parameters:
        - name: centerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaregiverCreateRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderCaregiverResponse'
        '400':
          description: ProviderService error
        '401':
          description: ProviderService error
        '403':
          description: ProviderService error
        '404':
          description: ProviderService error
        '500':
          description: ProviderService error
        '503':
          description: ProviderService error
  /v1/caregivers/{caregiverId}:
    get:
      tags:
        - ProviderCaregiver
      operationId: getProviderCaregiver
      parameters:
        - name: caregiverId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderCaregiverResponse'
        '400':
          description: ProviderService error
        '401':
          description: ProviderService error
        '403':
          description: ProviderService error
        '404':
          description: ProviderService error
        '500':
          description: ProviderService error
        '503':
          description: ProviderService error
    put:
      tags:
        - ProviderCaregiver
      operationId: updateProviderCaregiver
      parameters:
        - name: caregiverId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaregiverUpdateRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderCaregiverResponse'
        '400':
          description: ProviderService error
        '401':
          description: ProviderService error
        '403':
          description: ProviderService error
        '404':
          description: ProviderService error
        '500':
          description: ProviderService error
        '503':
          description: ProviderService error
    delete:
      tags:
        - ProviderCaregiver
      operationId: archiveProviderCaregiver
      parameters:
        - name: caregiverId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: version
          in: query
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyActionResponse'
        '400':
          description: ProviderService error
        '401':
          description: ProviderService error
        '403':
          description: ProviderService error
        '404':
          description: ProviderService error
        '500':
          description: ProviderService error
        '503':
          description: ProviderService error
  /v1/caregivers/{id}/verification:
    patch:
      tags:
        - ProviderCaregiver
      operationId: verifyProviderCaregiver
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderCaregiverResponse'
        '400':
          description: ProviderService error
        '401':
          description: ProviderService error
        '403':
          description: ProviderService error
        '404':
          description: ProviderService error
        '500':
          description: ProviderService error
        '503':
          description: ProviderService error
  /v1/certificates/caregivers/{caregiverId}:
    get:
      tags:
        - ProviderCertificate
      operationId: listProviderCertificates
      parameters:
        - name: caregiverId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
