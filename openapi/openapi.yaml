components:
  responses:
    '400':
      description: HTTP 400; business endpoints return APIResponse
    '401':
      description: HTTP 401; business endpoints return APIResponse
    '403':
      description: HTTP 403; business endpoints return APIResponse
    '500':
      description: HTTP 500; business endpoints return APIResponse
    '503':
      description: HTTP 503; business endpoints return APIResponse
  schemas:
    ProviderCenterRecord:
      type: object
      required:
        - id
        - centerName
        - centerStatus
        - version
      properties:
        id: &a1
          type: string
          format: uuid
        centerId:
          type: string
          format: uuid
        centerName:
          type: string
        phoneNumber:
          type: string
        email:
          type: string
        address:
          type: string
        operatingHours:
          type: string
        centerStatus:
          type: string
          enum:
            - PENDING
            - ACTIVE
            - INACTIVE
            - SUSPENDED
            - REJECTED
            - ARCHIVED
        statusReason:
          type: string
        managerUserId:
          type: string
          format: uuid
        version:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ProviderCaregiverRecord:
      type: object
      required:
        - id
        - centerId
        - fullName
        - caregiverStatus
        - verificationStatus
        - version
      properties:
        id: *a1
        caregiverId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        centerId:
          type: string
          format: uuid
        centerName:
          type: string
        fullName:
          type: string
        gender:
          type: string
          enum:
            - MALE
            - FEMALE
            - OTHER
        dateOfBirth:
          type: string
          format: date
        experienceYears:
          type: integer
        bio:
          type: string
        ratingAverage:
          type: number
        ratingCount:
          type: integer
        verificationStatus:
          type: string
          enum:
            - PENDING
            - VERIFIED
            - REJECTED
        caregiverStatus:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
            - SUSPENDED
            - ARCHIVED
        verificationReason:
          type: string
        version:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ProviderCertificateRecord:
      type: object
      required:
        - id
        - caregiverId
        - certificateName
        - issuedBy
        - verificationStatus
        - version
      properties:
        id: *a1
        caregiverId:
          type: string
          format: uuid
        certificateName:
          type: string
        issuedBy:
          type: string
        credentialNumber:
          type: string
        issuedDate:
          type: string
          format: date
        expiryDate:
          type: string
          format: date
        verificationStatus:
          type: string
          enum:
            - PENDING
            - VERIFIED
            - REJECTED
        verificationReason:
          type: string
        version:
          type: integer
        createdAt:
          type: string
          format: date-time
    ProviderWorkShiftRecord:
      type: object
      required:
        - id
        - centerId
        - workDate
        - startTime
        - endTime
        - shiftType
        - shiftStatus
        - capacity
        - version
      properties:
        id: *a1
        centerId:
          type: string
          format: uuid
        centerName:
          type: string
        workDate:
          type: string
          format: date
        startTime:
          type: string
        endTime:
          type: string
        shiftType:
          type: string
        shiftStatus:
          type: string
          enum:
            - DRAFT
            - OPEN
            - CLOSED
            - CANCELLED
            - COMPLETED
        capacity:
          type: integer
        approvedCount:
          type: integer
        registrationDeadline:
          type: string
          format: date-time
        note:
          type: string
        version:
          type: integer
        createdAt:
          type: string
          format: date-time
    ProviderShiftRegistrationRecord:
      type: object
      required:
        - id
        - workShiftId
        - caregiverId
        - registrationStatus
        - version
      properties:
        id: *a1
        workShiftId:
          type: string
          format: uuid
        caregiverId:
          type: string
          format: uuid
        caregiverName:
          type: string
        registrationStatus:
          type: string
          enum:
            - PENDING
            - APPROVED
            - REJECTED
            - CANCELLED
        caregiverNote:
          type: string
        rejectionReason:
          type: string
        version:
          type: integer
        createdAt:
          type: string
          format: date-time
